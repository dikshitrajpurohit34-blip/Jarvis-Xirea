name: Build JARVIS Xirea APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept Android SDK licenses
    run: yes | sdkmanager --licenses

  - name: Install Android build requirements
    run: |
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Prepare llama.cpp
    run: |
      mkdir -p app/src/main/cpp
      if [ ! -f app/src/main/cpp/llama.cpp/CMakeLists.txt ]; then
        git clone --depth 1 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
      fi

  - name: Build debug APK
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: jarvis-xirea-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
