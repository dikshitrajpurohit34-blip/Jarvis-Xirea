name: Build JARVIS Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Debug APK
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Locate Android SDK and install build tools
    shell: bash
    run: |
      set -euo pipefail

      export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      export ANDROID_SDK_ROOT="$ANDROID_HOME"

      if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
        echo "ERROR: Android SDK command-line tools directory not found."
        echo "Checked: $ANDROID_HOME/cmdline-tools"
        exit 1
      fi

      SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"

      if [ -z "$SDKMANAGER" ]; then
        echo "ERROR: sdkmanager was not found in $ANDROID_HOME/cmdline-tools"
        exit 1
      fi

      echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      yes | "$SDKMANAGER" --licenses || true

      "$SDKMANAGER" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "cmake;3.22.1" \
        "ndk;29.0.14206865"

  - name: Make Gradle wrapper executable
    run: chmod +x ./gradlew

  - name: Build debug APK
    run: ./gradlew --no-daemon :app:assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: JARVIS-debug-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
