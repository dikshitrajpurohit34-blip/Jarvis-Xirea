name: Build JARVIS Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Debug APK
runs-on: ubuntu-latest
timeout-minutes: 60

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Find Android SDK tools
    shell: bash
    run: |
      set -euo pipefail

      SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

      if [ ! -x "$SDKMANAGER" ]; then
        echo "ERROR: sdkmanager not found at $SDKMANAGER"
        find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager
        exit 1
      fi

      echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
      echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

  - name: Accept Android SDK licenses
    shell: bash
    run: |
      yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses || true

  - name: Install Android build packages
    shell: bash
    run: |
      set -euo pipefail
      "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install \
        "platforms;android-35" \
        "build-tools;35.0.0"
